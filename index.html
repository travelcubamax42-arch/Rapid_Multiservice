<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Multiservice - Envíos y Combos a Cuba</title>
    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #ff6600;
            --bg-color: #f4f4f9;
        }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: #333; }
        header { background: var(--primary-color); color: white; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        /* Panel de Administración */
        .admin-panel { background: #eef2f7; padding: 20px; border-radius: 6px; margin-bottom: 30px; border-left: 5px solid var(--primary-color); }
        .admin-panel h3 { margin-top: 0; color: var(--primary-color); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { background: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #002244; }

        /* Catálogo de Productos */
        .catalog-section h2 { border-bottom: 2px solid var(--primary-color); padding-bottom: 8px; color: var(--primary-color); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 6px; background: #fff; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; background: #eee; }
        .product-card h4 { margin: 12px 0 8px; font-size: 18px; color: #222; }
        .product-card p { font-size: 16px; color: var(--accent-color); font-weight: bold; margin: 0; }
        .loading-text { text-align: center; color: #666; font-style: italic; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <h1>Rapid Multiservice</h1>
        <p>Envíos y Combos directos a Cuba en Tiempo Real</p>
    </header>

    <div class="container">
        <!-- Panel de Administración (Para agregar nuevos productos a la BD) -->
        <div class="admin-panel">
            <h3>🔒 Panel de Administración de Artículos</h3>
            <p style="font-size: 13px; color: #555;">Agrega un producto y se actualizará instantáneamente para todos tus clientes.</p>
            <form id="product-form">
                <input type="text" id="nombre" placeholder="Nombre del combo o artículo (ej. Combo Familiar)" required>
                <input type="number" id="precio" placeholder="Precio en USD ($)" step="0.01" required>
                <input type="url" id="imagen" placeholder="Enlace web de la imagen (URL https://...)" required>
                <button type="submit">Guardar y Publicar en la Tienda</button>
            </form>
        </div>

        <!-- Catálogo Visible para Clientes -->
        <div class="catalog-section">
            <h2>Catálogo & Combos Disponibles</h2>
            <div id="product-list" class="product-grid">
                <p class="loading-text">Conectando con la base de datos...</p>
            </div>
        </div>
    </div>

    <!-- Integración con Firebase SDK (Módulos ES6) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REEMPLAZA ESTOS DATOS CON LOS DE TU PROYECTO DE FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "tu-id",
            appId: "tu-id"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const productListEl = document.getElementById("product-list");
        const productForm = document.getElementById("product-form");

        // Función para cargar los productos desde la base de datos Firestore
        async function cargarProductos() {
            try {
                const querySnapshot = await getDocs(collection(db, "productos"));
                
                if (querySnapshot.empty) {
                    productListEl.innerHTML = "<p class='loading-text'>No hay productos registrados en este momento.</p>";
                    return;
                }

                productListEl.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    const card = document.createElement("div");
                    card.className = "product-card";
                    
                    // Imagen por defecto si falla el enlace
                    const imgUrl = prod.imagen || "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=300&q=80";
                    
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${prod.nombre}" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=300&q=80'">
                        <h4>${prod.nombre}</h4>
                        <p>$${parseFloat(prod.precio).toFixed(2)} USD</p>
                    `;
                    productListEl.appendChild(card);
                });
            } catch (error) {
                console.error("Error al obtener los productos: ", error);
                productListEl.innerHTML = "<p class='loading-text' style='color: red;'>Error al conectar con la base de datos.</p>";
            }
        }

        // Evento del formulario para enviar nuevos productos a Firebase
        productForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const nombre = document.getElementById("nombre").value;
            const precio = parseFloat(document.getElementById("precio").value);
            const imagen = document.getElementById("imagen").value;

            try {
                await addDoc(collection(db, "productos"), {
                    nombre: nombre,
                    precio: precio,
                    imagen: imagen,
                    fechaCreacion: new Date()
                });
                
                alert("¡Producto agregado y sincronizado con éxito!");
                productForm.reset();
                cargarProductos(); // Refrescar la lista automáticamente
            } catch (error) {
                console.error("Error al guardar el producto: ", error);
                alert("Hubo un error al guardar el producto en la base de datos.");
            }
        });

        // Cargar los productos al iniciar la página
        cargarProductos();
    </script>
</body>
</html>
